name: Publish to MCP Registry

# Publishes server.json when its version is not yet in the official MCP Registry.
# Authenticates with GitHub OIDC, so no token is stored in this repository.
on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
      SERVER_NAME: io.github.AirDesk-Inc/remote-computer-use
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check whether this version is already published
        id: registry
        run: |
          set -euo pipefail
          version="$(jq -r .version server.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          url="https://registry.modelcontextprotocol.io/v0/servers?search=${SERVER_NAME}&version=${version}"
          count="$(curl --fail --silent --show-error "$url" | jq --arg n "$SERVER_NAME" --arg v "$version" \
            '[.servers[] | select(.server.name == $n and .server.version == $v)] | length')"
          if [ "$count" -gt 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$SERVER_NAME@$version is already in the registry; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: steps.registry.outputs.published == 'false'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.registry.outputs.published == 'false'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        if: steps.registry.outputs.published == 'false'
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        if: steps.registry.outputs.published == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        if: steps.registry.outputs.published == 'false'
        run: ./mcp-publisher publish
