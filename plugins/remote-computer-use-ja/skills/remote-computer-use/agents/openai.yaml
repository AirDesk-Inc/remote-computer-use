interface:
  display_name: "AirDesk リモートコンピューター操作 (RCU)"
  short_description: "AirDesk RCU とリモート agent-desktop 自動化"
  icon_small: "./assets/airdesk-symbol.svg"
  icon_large: "./assets/airdesk-lockup.svg"
  brand_color: "#176BFF"
  default_prompt: "許可された AirDesk の作業に $remote-computer-use を使ってください。対象へのアクセスを確認し、対象 OS のガイドを適用してください。ブリッジなしの接続を求められ、ツール一覧が対応する場合は direct_host を使ってください。ローカルまたはブリッジのデスクトップ操作には表示中の対話型ウィンドウを使ってください。"
